{% extends 'requestdataapp/base.html' %}

{% block title %}
    Upload file
{% endblock %}

{% block body %}
    <h1>Upload file</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
        {{ form.as_p }}
        </div>
        <button type="submit">Upload</button>
    </form>
{% endblock %}
